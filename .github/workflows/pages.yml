name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run the tests before publishing
        run: npm test
      - name: Verify the vendored files against the manifest (offline)
        run: node --test tests/vendor.test.js
      - name: Assemble the static site
        # The page, its ES modules, the vendored runtime code (urdf-inspector
        # core, three.js and its LICENSE files) and the example models,
        # unbundled. The CLI (src/cli.js, src/node/) is Node-only and not shipped.
        run: |
          mkdir -p _site/src
          cp index.html styles.css _site/
          cp -r src/core src/ui _site/src/
          cp -r vendor examples _site/
          # axe-core is for the browser tests only.
          rm -rf _site/vendor/axe-core
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Screenshots for the documentation pages, taken from the live site once it
  # serves this commit. The ROS 2 live view connects from the https site to a
  # fake rosbridge server on the runner (simulated fixture data), with the
  # browser's local network permission granted over DevTools.
  screenshots:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Wait until the live site serves this commit's page
        run: |
          want=$(sha256sum index.html | cut -d' ' -f1)
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://projectbin07-stack.github.io/robot-studio/index.html?nocache=$i" | sha256sum | cut -d' ' -f1 || true)
            if [ "$got" = "$want" ]; then echo "live site is current"; exit 0; fi
            sleep 10
          done
          echo "the live site did not serve this commit within 10 minutes"; exit 1
      - name: Screenshots of every feature from the live site
        run: |
          mkdir shots
          node scripts/fake-rosbridge.mjs --port 9090 --fixture tests/fixtures/rosbridge/sim_mecanum.jsonl --description tests/fixtures/rosbridge/robot_description.urdf --log rb.jsonl &
          node bin/robot-studio.js sim mecanum --world office --route demo --seconds 20 --seed 1 --out rec > /dev/null
          (cd rec && python3 -m zipfile -c ../rec.zip .)
          sleep 1
          L="https://projectbin07-stack.github.io/robot-studio/"
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome --timeout 240000"
          $S --url "$L" --theme light --tour --shots shots/first-run
          $S --url "${L}?theme=light" --select-link base_link --expect-links 11 --screenshot shots/model.png
          $S --url "${L}?theme=light" --template mecanum --select-link front_left_wheel --expect-links 10 --screenshot shots/builder.png
          $S --url "${L}?theme=light" --template mecanum --sim --sim-world office --sim-route demo --sim-seconds 20 --expect-links 10 --screenshot shots/simulation.png
          $S --url "${L}?theme=light" --template mecanum --ros ws://127.0.0.1:9090 --grant-local-network --ros-keep-armed --ros-log rb.jsonl --expect-links 10 --screenshot shots/ros2-live.png
          $S --url "${L}?theme=light" --template mecanum --replay rec.zip --expect-links 10 --screenshot shots/ros2-replay.png
          $S --url "${L}?theme=dark" --width 390 --height 844 --mobile --expect-links 11 --screenshot shots/phone.png
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: docs-screenshots
          path: shots/
          if-no-files-found: ignore
