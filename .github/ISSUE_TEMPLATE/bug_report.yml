name: Bug report
description: A model that will not open, xacro output that differs from the official xacro, a wrong 3D view, a crash
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you saw and what you expected. For xacro differences, include what `xacro` (the official tool) prints for the same input.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal input
      description: The smallest URDF/xacro that shows the problem. Do not paste models you are not allowed to share.
      render: xml
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Output of `robot-studio --version`, or the footer of the page.
  - type: input
    id: environment
    attributes:
      label: Browser or Node version, and OS
