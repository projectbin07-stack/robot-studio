name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - name: Run the tests before publishing
        run: npm test
      - name: Verify the vendored files against the manifest (offline)
        run: node --test tests/vendor.test.js
      - name: Assemble the static site
        # The page, its ES modules, the vendored runtime code (urdf-inspector
        # core, three.js and its LICENSE files) and the example models,
        # unbundled. The CLI (src/cli.js, src/node/) is Node-only and not shipped.
        run: |
          mkdir -p _site/src
          cp index.html styles.css _site/
          cp -r src/core src/ui _site/src/
          cp -r vendor examples _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
