version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Types must match the oldest supported Node (22), so the typecheck
      # rejects APIs that only exist in newer releases.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # three.js is vendored at a pinned release (scripts/vendor-lib.js); a
      # bump means re-vendoring and re-checking the 3D view, done by hand.
      - dependency-name: "three"
      - dependency-name: "@types/three"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: monthly
    open-pull-requests-limit: 2
