name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ["22", "24"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dev tools
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Type check (JSDoc, strict)
        run: npm run typecheck

      - name: Test with coverage thresholds (src/core)
        run: npm run coverage

      - name: CLI smoke test
        shell: bash
        run: |
          B=bin/robot-studio.js
          node $B --version
          node $B check examples/studio_mecanum/urdf/studio_mecanum.urdf.xacro --strict
          node $B xacro examples/third_party/turtlebot3_description/urdf/turtlebot3_burger.urdf.xacro -o burger.urdf
          cmp burger.urdf tests/corpus/golden/turtlebot3-burger.urdf
          node $B xacro examples/third_party/ros2_control_demos/example_1/description/urdf/rrbot.urdf.xacro prefix:=arm_ | grep -q 'name="arm_joint1"'
          # A model with warnings fails --strict with exit code 1.
          set +e
          node $B check examples/third_party/turtlebot3_description/urdf/turtlebot3_burger.urdf.xacro --strict > /dev/null
          code=$?
          set -e
          test "$code" -eq 1

      - name: "Simulation: committed fixtures are current; the CLI run is deterministic (step time measured on this runner)"
        shell: bash
        run: |
          node scripts/sim-fixtures.js --check
          B=bin/robot-studio.js
          node $B sim mecanum --world office --route demo --seconds 60 --seed 1 --out run1
          node $B sim mecanum --world office --route demo --seconds 60 --seed 1 --out run2 > /dev/null
          diff -r run1 run2
          node $B sim diff --world lab --route square --seconds 20 --seed 2
          node $B sim examples/third_party/turtlebot3_description/urdf/turtlebot3_burger.urdf.xacro --world loop --seconds 20
          sha256sum run1/*

      - name: "ROS 2: committed bag and rosbridge fixtures are current; bag export, replay and compare from the CLI"
        shell: bash
        run: |
          node scripts/bag-fixtures.js --check
          node scripts/rosbridge-fixtures.js --check
          B=bin/robot-studio.js
          node $B bag run1 -o bag1
          node $B bag run2 -o bag2 --name bag1
          cmp bag1/bag1_0.mcap bag2/bag1_0.mcap
          node $B replay run1
          node $B compare run1 mecanum --ideal

  xacro-golden:
    name: Goldens match the official xacro
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install the official xacro from PyPI
        run: python -m pip install -r scripts/requirements-golden.txt
      - name: Regenerate every golden output and fail if any differs from the committed one
        run: |
          python scripts/xacro_golden.py
          git diff --exit-code -- tests/corpus/golden
      - name: Compare Robot Studio's expansion with the goldens
        run: |
          node --test tests/xacro-golden.test.js
          node scripts/golden-report.js
      - name: Builder exports are current, and the official xacro's expansion of each exported xacro equals the exported URDF
        run: |
          node scripts/builder-fixtures.js --check
          node --test --test-name-pattern "official xacro" tests/builder-templates.test.js

  vendor:
    name: Vendored code matches its pinned upstream
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Re-fetch urdf-inspector at its tag and three.js from npm, compare every byte
        run: node scripts/vendor.mjs --verify

  mecanum-interop:
    name: Exported TOML loads in mecanum-kinematics (public tag) and its IK/FK agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install mecanum-kinematics from its public release tag
        run: python -m pip install "mecanum-kinematics @ git+https://github.com/projectbin07-stack/mecanum-kinematics@v0.1.0"
      - name: The committed exports are what the builder writes today
        run: node scripts/builder-fixtures.js --check
      - name: Load each TOML with mecanum-kinematics and compare wheel geometry, IK and FK with Robot Studio
        run: python scripts/mecanum_interop.py
      - name: The CLI writes the same TOML
        run: |
          node bin/robot-studio.js new mecanum -f toml -o cli.toml
          cmp cli.toml tests/corpus/builder/mecanum.toml

  firmware-interop:
    name: Simulated drive matches encoder-odometry-firmware's Python model (public tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install odobridge (the firmware's host package and firmware model) from its release tag
        run: python -m pip install "odobridge @ git+https://github.com/projectbin07-stack/encoder-odometry-firmware@v0.2.0#subdirectory=host"
      - name: The committed telemetry is what the simulator writes today
        run: node scripts/sim-fixtures.js --check
      - name: Replay the command schedule through the firmware model and compare every WHEEL_STATE and ODOMETRY frame
        run: python scripts/firmware_interop.py

  lsl-crosscheck:
    name: Estimators reproduce lidar-slam-lab's own benchmark (public tag)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Clone lidar-slam-lab at the vendored tag
        run: git -c advice.detachedHead=false clone --quiet --depth 1 --branch v0.2.1 https://github.com/projectbin07-stack/lidar-slam-lab.git lsl
      - name: Reference runs through Robot Studio's estimator wrapper vs lidar-slam-lab's CLI benchmark (every printed number), then the full simulation on the same maps
        run: node scripts/lsl-crosscheck.mjs --lsl lsl --seeds 5 --full-seeds 1

  python-companion:
    name: robot-studio-bag on ${{ matrix.os }} / Python ${{ matrix.python }} (rosbag-inspect v0.3.0)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.13"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install the companion with rosbag-inspect from its v0.3.0 tag
        run: python -m pip install "./[dev]"
      - name: Lint, format, type check
        run: |
          ruff check .
          ruff format --check .
          mypy
      - name: Tests (Robot Studio's own MCAP export of a simulated run, and a robot-like SQLite3 bag)
        run: python -m pytest --cov --cov-report=term-missing --cov-fail-under=85

  bag-roundtrip:
    name: "Round trip: simulation -> MCAP -> rosbag-inspect v0.3.0 -> robot-studio-bag -> replay, value by value"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install robot-studio-bag (pulls rosbag-inspect from its v0.3.0 tag)
        run: python -m pip install ./python
      - name: Simulate 60 s (mecanum, office) and 20 s (differential, lab); export both as bags
        run: |
          B=bin/robot-studio.js
          node $B sim mecanum --world office --route demo --seconds 60 --seed 1 --out mec/run --bag mec/bag
          node $B sim diff --world lab --route square --seconds 20 --seed 2 --out diff/run --bag diff/bag
      - name: Read the bags back with rosbag-inspect (info with per-topic Hz, check, LaserScan arrays with export --arrays)
        run: |
          rosbag-inspect --version
          rosbag-inspect info mec/bag | tee info.txt
          # rosbag-inspect 0.3.0 shows per-topic rates for MCAP: the simulated scan is 10 Hz, the IMU 100 Hz.
          grep -E "^ +/scan +[0-9]+ +10\.00 " info.txt
          grep -E "^ +/imu +[0-9]+ +100\.00 " info.txt
          rosbag-inspect check mec/bag --expect /scan:10 --expect /imu:100 --expect /odom:20
          rosbag-inspect export mec/bag /scan scan.csv --arrays
          python scripts/check_scan_export.py scan.csv mec/run/scans.jsonl
      - name: Import with robot-studio-bag and compare every stream and the replay with the original
        run: |
          robot-studio-bag mec/bag mec/imported
          node scripts/bag-roundtrip.mjs --original mec/run --imported mec/imported
          robot-studio-bag diff/bag diff/imported
          node scripts/bag-roundtrip.mjs --original diff/run --imported diff/imported
          node bin/robot-studio.js replay mec/imported
      - name: "Simulation vs recording: the imported (simulated) bag's command schedule on the simulator"
        run: |
          node bin/robot-studio.js compare mec/imported mecanum
          node bin/robot-studio.js compare mec/imported mecanum --ideal

  ros2-bag:
    name: Exported bag read by ROS 2 Humble (ros2 bag info, rosbag2_py + rclpy deserialization)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Simulate 30 s and export the bag
        run: node bin/robot-studio.js sim mecanum --world office --route demo --seconds 30 --seed 1 --out out/run --bag out/bag
      - name: ros:humble-ros-base with ros-humble-rosbag2-storage-mcap
        run: docker run --rm -v "$PWD/out:/data:ro" -v "$PWD/scripts:/scripts:ro" ros:humble-ros-base bash /scripts/ros2_bag_check.sh

  ros2-package:
    name: Exported ROS 2 packages build with colcon (ros:humble-ros-base)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Export packages from the three templates and from an opened model with meshes
        run: |
          mkdir pkgs
          B=bin/robot-studio.js
          node $B new mecanum -f package -o pkgs/mecanum.zip
          node $B new diff --set camera=true -f package -o pkgs/diff.zip
          node $B new arm --set dof=6 --set camera=true -f package -o pkgs/arm.zip
          node $B export examples/studio_mecanum/urdf/studio_mecanum.urdf.xacro -f package -o pkgs/studio.zip
      - name: colcon build, check_urdf, ROS xacro, ros2 launch --show-args, robot_state_publisher
        run: docker run --rm -v "$PWD/pkgs:/pkgs:ro" -v "$PWD/scripts:/scripts:ro" ros:humble-ros-base bash /scripts/ros2_package_check.sh

  browser:
    name: Browser smoke test (headless Chrome, WebGL via SwiftShader; accessibility; performance budget)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Load each example, a zip upload and a phone-width view; check links, WebGL output and console
        run: |
          PORT=8000 node scripts/serve.js &
          sleep 1
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/?theme=light" --expect-links 11 --expect-summary "0 error(s), 0 warning(s), 1 note(s)" --screenshot mecanum.png --axe --axe-report axe-light.json
          $S --url "http://127.0.0.1:8000/?theme=dark" --expect-links 11 --axe --axe-report axe-dark.json
          $S --url "http://127.0.0.1:8000/?s=turtlebot3" --expect-links 7 --expect-summary "meshes 4/4 shown"
          $S --url "http://127.0.0.1:8000/?s=r2d2" --expect-links 16 --expect-summary "meshes 8/8 shown"
          $S --url "http://127.0.0.1:8000/?s=rrbot" --expect-links 5
          $S --url "http://127.0.0.1:8000/?a=use_lidar:false,use_camera:false" --expect-links 7
          $S --url "http://127.0.0.1:8000/" --upload tests/fixtures/description.zip --expect-links 1 --expect-summary "meshes 1/1 shown"
          $S --url "http://127.0.0.1:8000/?theme=dark" --width 390 --height 844 --mobile --expect-links 11 --screenshot phone.png --axe --axe-report axe-phone.json
      - name: "Accessibility: keyboard only (tree, a joint slider, the view toolbar, the Simulate and ROS 2 panels; focus outlines), in both themes; axe-core WCAG 2.1 A/AA after each"
        run: |
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/?theme=light" --keyboard --axe --expect-links 11 --timeout 120000
          $S --url "http://127.0.0.1:8000/?theme=dark" --keyboard --axe --expect-links 11 --timeout 120000
          $S --url "http://127.0.0.1:8000/?s=r2d2&theme=dark" --keyboard --axe --expect-links 16 --timeout 120000
      - name: "Performance budget: a generated 200-link model with about 50 MB of STL meshes opens in under 10 s (open time in the output)"
        run: |
          node scripts/large-model.mjs -o large_robot.zip
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/" --upload large_robot.zip --expect-links 200 --expect-summary "meshes 200/200 shown" --max-open-ms 10000 --timeout 180000 --screenshot large-model.png
          rm large_robot.zip
      - name: "Builder: mecanum template through the UI, edit a parameter, undo with Ctrl+Z, export, reload (edit timing in the output)"
        # The server started in the previous step is still running.
        run: |
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/" --builder --select-link front_left_wheel --expect-links 10 --expect-summary "0 error(s), 0 warning(s)" --screenshot builder.png --axe --axe-report axe-builder.json
          $S --url "http://127.0.0.1:8000/?s=r2d2" --edit-model --expect-links 16 --expect-summary "meshes 8/8 shown"
          $S --url "http://127.0.0.1:8000/" --template arm --expect-links 9 --expect-summary "0 error(s), 0 warning(s), 0 note(s)"
      - name: "Simulation: mecanum template on a scripted route, the robot moves, error measures and plots fill in; teleop, world edit, a setting, recording download; no console errors (frame rate and step time in the output)"
        run: |
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/?theme=light" --template mecanum --sim --sim-world office --sim-route demo --sim-seconds 15 --sim-interact --expect-links 10 --screenshot sim-mecanum.png --timeout 180000 --axe --axe-report axe-sim.json
          $S --url "http://127.0.0.1:8000/" --template diff --sim --sim-world lab --sim-route square --sim-seconds 8 --expect-links 9 --screenshot sim-diff.png --timeout 180000
      - name: "ROS 2 live view against the fake rosbridge server (simulated fixtures): connect by click, LIVE labels, opt-in, drive with W, release and blur stop it (the server's log is checked)"
        run: |
          node scripts/fake-rosbridge.mjs --port 9090 --fixture tests/fixtures/rosbridge/sim_mecanum.jsonl --description tests/fixtures/rosbridge/robot_description.urdf --log rosbridge-log.jsonl &
          sleep 1
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/?ros=ws%3A%2F%2F127.0.0.1%3A9090" --template mecanum --ros ws://127.0.0.1:9090 --ros-log rosbridge-log.jsonl --expect-links 10 --screenshot ros-live.png --timeout 180000 --axe --axe-report axe-ros-live.json
      - name: "ROS 2 replay of a recording zip (simulated run) and the comparison with the simulator"
        run: |
          node bin/robot-studio.js sim mecanum --world office --route demo --seconds 20 --seed 1 --out rec
          (cd rec && python3 -m zipfile -c ../rec.zip .)
          S="node scripts/browser-smoke.mjs --browser /usr/bin/google-chrome"
          $S --url "http://127.0.0.1:8000/" --template mecanum --replay rec.zip --expect-links 10 --screenshot ros-replay.png --timeout 180000 --axe --axe-report axe-replay.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots
          path: |
            *.png
            axe-*.json
          if-no-files-found: ignore
